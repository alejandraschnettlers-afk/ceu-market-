<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEU Market · Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#123285;--noche:#070850;--lima:#C6F04A;--claro:#DDE3F4;--hielo:#F3F6FA;--plata:#C9CFDA;--suave:#4A5275}
*{box-sizing:border-box}
body{margin:0;background:var(--hielo);color:var(--noche);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:1rem;line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
:focus-visible{outline:3px solid var(--lima);outline-offset:2px;box-shadow:0 0 0 2px var(--noche)}
header{background:var(--azul);color:#fff;padding:.875rem 1.5rem}
.cab{max-width:80rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.625rem;font-size:1.4rem;color:#fff;text-decoration:none}
.logo b{font-weight:800}.logo span{font-weight:500}
main{flex:1;width:100%;max-width:48rem;margin:0 auto;padding:3rem 1.5rem}
.tarjeta{background:#fff;border:1px solid var(--plata);border-radius:20px;padding:2.25rem;display:flex;flex-direction:column;gap:1rem}
.check{width:64px;height:64px;border-radius:999px;background:var(--lima);display:flex;align-items:center;justify-content:center}
h1{margin:0;font-size:2.25rem;font-weight:800;line-height:1.1}
p{margin:0;font-size:1.0625rem}
.dato{background:var(--claro);border-radius:16px;padding:1rem 1.125rem;display:flex;flex-direction:column;gap:.25rem}
.dato span{font-size:.875rem;color:var(--suave);font-weight:700}
.dato strong{font-size:1.125rem;word-break:break-all}
button{font-family:inherit;height:52px;border-radius:16px;border:2px solid var(--azul);background:#fff;color:var(--azul);font-weight:700;font-size:1rem;cursor:pointer;padding:0 1.25rem;align-self:flex-start}
button:hover{background:var(--claro)}
.suave{color:var(--suave);font-size:.9375rem}
</style>
</head>
<body>
<header>
  <div class="cab">
    <a class="logo" href="index.html" aria-label="CEU Market">
      <svg width="40" height="31" viewBox="-4 -4 128 92" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 50 V30 Q14 16 28 16 H96 M86 4 L98 16 L86 28" stroke="#FFFFFF"/><path d="M106 34 V54 Q106 68 92 68 H24 M34 56 L22 68 L34 80" stroke="#C6F04A"/></svg>
      <span aria-hidden="true"><b>CEU</b> <span>Market</span></span>
    </a>
  </div>
</header>
<main>
  <section class="tarjeta" aria-labelledby="h">
    <span class="check" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#070850" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <h1 id="h">¡Ya estás dentro!</h1>
    <p>Has entrado con tu correo del CEU verificado.</p>
    <div class="dato"><span>Correo</span><strong id="email">—</strong></div>
    <div class="dato"><span>Facultad</span><strong id="facultad">—</strong></div>
    <p class="suave">Aquí irá la Home de CEU Market en la siguiente versión de la web.</p>
    <button type="button" id="salir">Cerrar sesión</button>
  </section>
</main>
<script>
(function () {
  var leer = function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  var sesion = leer('ceu_sesion');
  if (!sesion || !sesion.email || !sesion.exp || Date.now() > sesion.exp) { location.replace('index.html'); return; }
  var fac = leer('ceu_facultad');
  document.getElementById('email').textContent = sesion.email;
  document.getElementById('facultad').textContent = fac ? fac.nombre : '—';
  document.getElementById('salir').addEventListener('click', function () {
    try { localStorage.removeItem('ceu_sesion'); localStorage.removeItem('ceu_facultad'); } catch (e) {}
    location.href = 'index.html';
  });
})();
</script>
</body>
</html>
